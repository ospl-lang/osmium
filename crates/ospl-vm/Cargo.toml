[package]
name = "ospl-vm"
version = "0.1.0"
edition = "2024"

[features]
serde = ["dep:serde", "dep:serde_yaml"]

[dependencies]
serde = { version = "1.0.228", optional = true, features = ["serde_derive"] }
serde_yaml = { version = "0.9.34", optional = true }
ospl-common = { path = "../ospl-common" }
libloading = "0.9.0"
libffi = "4.1"
# libffi = {version = "4.1", features = ["system"]}
arrayvec = "0.7.6"

[dev-dependencies]
criterion = "0.5.1"
pprof = { version = "0.14.0", features = ["protobuf", "flamegraph", "criterion"] }

